# nginx virtual host configuration file for gametimer.org
# to proxy gametimer.org to a docker port
#
# version 2024-12-13
#
# edit with
# vim /etc/nginx/sites-available/gametimer.org.conf
#
# activate with:
# ln -s /etc/nginx/sites-available/gametimer.org.conf /etc/nginx/sites-enabled/gametimer.org.conf
#
# deactivate with:
# rm /etc/nginx/sites-enabled/gametimer.org.conf
#
# make nginx reload configuration with:
# systemctl reload nginx

#################################################################
# install ssl certs with
# certbot certonly --webroot -w /var/www/html --rsa-key-size 4096 -d gametimer.org
# or include wwww version if using top level domain
# certbot certonly --webroot  -w /var/www/html --rsa-key-size 4096 -d gametimer.org -d www.gametimer.org
# for more information see "install-debian12-nginx-docker.sh"
# test with parameter --dry-run
#################################################################


## http
server {
  ## optionally set specific SERVER_IP correctly (don't use http2 here since this will not work with letsencrypt challenge)
  # listen SERVER_IP:80 http2;
  listen 80;

  ## set domain correctly
  # server_name gametimer.org;
  ## www version for top level domains
  server_name gametimer.org www.gametimer.org;

  ## Disables emitting nginx version in error messages and in the "Server" response header field.
  server_tokens off;

  ## serve certbot webroot challenge from /var/www/html/.well-known/acme-challenge
  location /.well-known/acme-challenge {
    # route to writable dir for certbot challenge
    root /var/www/html;
  }

  # redirect to https
  location / {
    return 301 https://$host$request_uri;
  }
}


## strip www on ssl request
 server {
  ## Change after having successfully requested the cert from letsencrypt
  # listen 443 ssl http2;
  listen 443;
  server_name www.gametimer.org;
  ## cert: Enable after having successfully requested the cert from letsencrypt
  # ssl_certificate /etc/letsencrypt/live/gametimer.org/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/gametimer.org/privkey.pem;
  ## $scheme will get the http protocol
   ## and 301 is best practice for tablet, phone, desktop and seo
   return 301 $scheme://gametimer.org$request_uri;
 }

## https proxy
server {
  ## listen SERVER_IP:443 ssl http2;
  ## Change after having successfully requested the cert from letsencrypt
  # listen 443 ssl http2;
  listen 443;

  ## set domain correctly
  server_name gametimer.org;

  ## cert: Enable after having successfully requested the cert from letsencrypt
  # ssl_certificate /etc/letsencrypt/live/gametimer.org/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/gametimer.org/privkey.pem;

  ## intermediate configuration (https://ssl-config.mozilla.org/)
  ## ssl_protocols TLSv1.2 TLSv1.3; version of nginx does not support v1.3 for now!!!
  ssl_protocols TLSv1.2;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;

  ## use improved custom dhparam generated with "cd /etc/ssl/certs && openssl dhparam -out dhparam.pem 4096"
  # ssl_dhparam /etc/ssl/certs/dhparam.pem;

  ## Disables emitting nginx version in error messages and in the "Server" response header field.
  server_tokens off;

  ## proxy all requests
  location / {
    ## set max upload size
    client_max_body_size 12M;
    ## set PORT correctly
    proxy_pass http://localhost:3006;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    ## tell client that the connection with the proxy was done with https
    proxy_set_header X-Forwarded-Proto https;

    ## increment timeout (may be necessary if client responses depends on queries to external api)
    # proxy_connect_timeout       180;
    # proxy_send_timeout          180;
    # proxy_read_timeout          180;
    # send_timeout                180;


    ## enable gzip (on the fly compression)
    gzip on;
    ## Dont compress files that are too small. TCP packet is 1500 bytes
    gzip_min_length 1500;
    ## enable compression for additional MIME-types besides "text/html". "text/html" is always compressed.
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    ## enable gzip for proxied requests (default off)
    # gzip_proxied expired no-cache no-store private auth;

    ## enable expires and client side caching (do not enable this for your api endpoint)
    expires 365d;
    add_header Pragma public;
    add_header Cache-Control "public";

    ## enable password protection
    ## install htpasswd tool with: apt-get install apache2-utils
    ## use 'htpasswd /etc/nginx/.htpasswd username' to set pwd for username
    ## see: https://community.openhab.org/t/using-nginx-reverse-proxy-authentication-and-https/14542
    # auth_basic                            "Username and Password Required";
    # auth_basic_user_file                  /etc/nginx/.htpasswd;


   }
}