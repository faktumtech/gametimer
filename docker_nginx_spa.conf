# modified nginx.conf for docker nginx image that serves static content for a spa
# it uses gzip_static to serve files with .gz extension as gzip

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Explicitly set charset for HTML files
    charset utf-8;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 80;
        root /usr/share/nginx/html;

        # Disable dynamic compression (optional, and not recommended if you're proxying)
        gzip off;
        # gzip_static (precompressed with .gz extension)
        gzip_static on;

        # make sure manifest.webmanifest is served as application/manifest+json
        location = /manifest.webmanifest {
          add_header Content-Type application/manifest+json;
        }

        # try to resolve static files (like css or images) if not found (like the url path) return the index.html
        location / {
            try_files $uri $uri/ /index.html;

            # enable caching of static content in static server instead of proxy server
            expires 360d;
            add_header Pragma public;
            add_header Cache-Control "public";
        }
    }
}
